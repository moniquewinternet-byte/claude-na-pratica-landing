<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Grupo do WhatsApp · Claude na Prática</title>
<meta name="description" content="Entre no grupo do WhatsApp do Claude na Prática." />
<meta name="robots" content="noindex, nofollow" />

<!--
  ===================================================================
  ÚNICO LUGAR PARA TROCAR O LINK DO GRUPO A CADA TURMA.
  Troque só o href do botão abaixo (id="ir").
  A página redireciona sozinha pra esse link, e a /obrigado, a bio
  e o guia apontam pra esta página, então muda num lugar só.
  ===================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Doto:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --base:#F4F6F9; --card:#FFFFFF; --ink:#14263C; --ink-soft:#5B6B7D;
    --azul:#0057B8; --laranja:#FF6B2B; --laranja-dark:#F0560F; --rosa:#FF3E8A; --line:#E4E9F0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100svh;
    background:
      radial-gradient(circle at 15% 10%, rgba(0,87,184,.07), transparent 42%),
      radial-gradient(circle at 88% 90%, rgba(255,107,43,.09), transparent 44%),
      var(--base);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    line-height:1.6;
    display:flex;align-items:center;justify-content:center;
    padding:26px 18px;-webkit-font-smoothing:antialiased;
  }
  .win{
    width:100%;max-width:520px;background:var(--card);
    border:1px solid var(--line);border-radius:18px;
    box-shadow:0 18px 50px rgba(20,38,60,.10);overflow:hidden;
  }
  .bar{display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);background:#FBFCFE}
  .dots{display:flex;gap:8px}
  .dots i{width:12px;height:12px;border-radius:50%;display:block}
  .dots i:nth-child(1){background:var(--azul)} .dots i:nth-child(2){background:var(--laranja)} .dots i:nth-child(3){background:var(--rosa)}
  .bar .file{font-weight:500;font-size:.82rem;color:var(--ink-soft)}
  .body{padding:clamp(28px,5.5vw,46px);text-align:center}
  .tag{
    display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--azul);
    border-radius:999px;padding:6px 14px;font-family:'Doto',monospace;font-weight:700;
    font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--azul);
  }
  .tag .pt{width:7px;height:7px;border-radius:50%;background:var(--laranja);display:inline-block}
  h1{
    font-family:'Chakra Petch',sans-serif;font-weight:700;
    font-size:clamp(1.9rem,7vw,2.6rem);line-height:1.05;letter-spacing:-.01em;margin:20px 0 0;
  }
  .lead{margin:14px auto 0;font-size:1rem;color:var(--ink-soft);max-width:30rem}
  .cta{
    display:inline-flex;align-items:center;gap:12px;margin-top:28px;
    background:var(--laranja);color:#fff;text-decoration:none;
    font-weight:600;font-size:clamp(.98rem,3.4vw,1.1rem);
    padding:17px 26px;border-radius:14px;box-shadow:0 10px 24px rgba(255,107,43,.30);
    transition:transform .15s ease,box-shadow .15s ease,background .15s ease;
  }
  .cta:hover{background:var(--laranja-dark);transform:translateY(-2px)}
  .cta:focus-visible{outline:3px solid var(--azul);outline-offset:3px}
  .cta svg{width:21px;height:21px;fill:currentColor;flex:none}
  .note{margin-top:20px;font-size:.86rem;color:var(--ink-soft)}
  .rule{height:1px;background:var(--line);margin:28px 0 0}
  footer{margin-top:16px;font-size:.8rem;color:var(--ink-soft)}
  .sig{font-weight:600;color:var(--ink)} .sig .ret{color:var(--azul);letter-spacing:.1em}
  @media (prefers-reduced-motion:reduce){.cta:hover{transform:none}}
  @media (max-width:480px){.cta{width:100%;justify-content:center}}
</style>
</head>
<body>

<main class="win">
  <div class="bar">
    <div class="dots"><i></i><i></i><i></i></div>
    <span class="file">grupo — claude na prática</span>
  </div>
  <div class="body">
    <span class="tag"><span class="pt"></span> Grupo do WhatsApp</span>
    <h1>Te levando pro grupo...</h1>
    <p class="lead">Se não abrir sozinho em alguns segundos, é só tocar no botão abaixo.</p>

    <a id="ir" class="cta" href="https://chat.whatsapp.com/K7sp9CTXjU9AzC0oq9L8BU" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.2-1.7-.9-2-1-.3-.1-.5-.2-.6.2-.2.3-.7 1-.9 1.1-.2.2-.3.2-.6.1-.3-.2-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.6-2.1-.2-.3 0-.5.1-.6l.5-.5c.1-.2.2-.3.3-.5 0-.2 0-.4 0-.5 0-.2-.6-1.5-.9-2.1-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s1 2.6 1.1 2.7c.1.2 1.9 3 4.7 4.2.6.3 1.1.4 1.5.6.6.2 1.2.2 1.6.1.5-.1 1.7-.7 1.9-1.3.2-.7.2-1.2.2-1.3-.1-.2-.3-.2-.6-.4zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
      Entrar no grupo do WhatsApp
    </a>

    <p class="note">Entrar no grupo garante que você recebe o link da aula, o dever de casa e os avisos do workshop.</p>

    <div class="rule"></div>
    <footer><span class="sig">@moniquetecnologia <span class="ret">•••</span></span></footer>
  </div>
</main>

<script>
  // Redireciona pro link do botão (fonte única). Atraso curto pra a página aparecer.
  (function(){
    var btn = document.getElementById('ir');
    if(!btn) return;
    var link = btn.getAttribute('href');
    setTimeout(function(){ window.location.href = link; }, 900);
  })();
</script>

</body>
</html>
